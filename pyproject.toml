[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptshield-agent"
version = "0.1.0"
description = "A function-calling AI agent that scans local AI-agent projects for prompt-injection and tool-misuse risks."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "PromptShield contributors" }]
license = { text = "MIT" }
keywords = ["ai-agent", "prompt-injection", "function-calling", "security", "cli"]
dependencies = []

[project.scripts]
promptshield = "promptshield.cli:main"

[tool.setuptools.packages.find]
include = ["promptshield*"]
